name: Daily HK Mall Offers & Images Sync

on:
  schedule:
    # 每天香港時間早上 8 點 (UTC 00:00) 自動執行
    - cron: "0 0 * * *"
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊觸發測試

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Run Mall Crawler (with Fallback)
        run: |
          python scripts/crawl_mall_directories.py

      - name: Fetch Google Facades
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python scripts/fetch_google_facades.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/malls.json frontend/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily sync mall offers and images [skip ci]" && git push)
