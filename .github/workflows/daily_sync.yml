name: Daily HK Mall Offers & Images Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow httpx python-dotenv

      - name: Run Mall Crawler (with Fallback)
        run: |
          python scripts/crawl_mall_directories.py

      - name: Fetch Google Facades
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python scripts/fetch_google_facades.py

      - name: Audit hotel offers (drop expired)
        run: |
          python scripts/audit_hotels.py --hotels data/hotels.json

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add malls.json data/ frontend/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily sync mall offers and images [skip ci]" && git push)
