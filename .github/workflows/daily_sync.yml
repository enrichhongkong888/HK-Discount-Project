name: Daily Mall & Store Audit Sync

on:
  schedule:
    # 每天 UTC 00:00 (香港時間 08:00) 自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動觸發

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Daily Audit & Cleanup
        run: |
          python scripts/daily_audit_and_cleanup.py

      - name: Fetch Missing Store Facades
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python scripts/fetch_google_facades.py

      - name: Commit & Push if updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff-index --quiet HEAD || (git commit -m "chore: auto daily cleanup expired offers and update facades [skip ci]" && git push)
